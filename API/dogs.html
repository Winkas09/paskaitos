<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="dogs.css" />
    <title>Dog Facts</title>
  </head>
  <body>
    <form id="dog-form">
      <div class="form">
        <label for="dog">Enter a dog breed:</label>
        <input type="text" id="dog" name="dog" required />
      </div>
      <button type="submit">Submit</button>
    </form>
    <div class="dogBreed">
      <button id="dog-breed">Get a random dog breed</button>
      <p></p>
    </div>
    <div class="dogImg">
      <button id="dog-image">Get a random dog image</button>
      <img alt="Dog image will appear here" />
    </div>
    <div class="breedSelector">
      <label for="breed-dropdown">Select a dog breed:</label>
      <select id="breed-dropdown">
        <option value="">Select a breed</option>
      </select>
    </div>
    <div class="dogImg"></div>
    <p class="error-message"></p>
    <script src="dogs.js"></script>
  </body>
</html>
